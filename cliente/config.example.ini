; Copie este arquivo para config.ini e ajuste para cada máquina (config.ini não vai para o git).
[servidor]
; Endereço do gerenciador (máquina onde roda servir.py).
url = http://127.0.0.1:5000
; Igual à variável API_TOKEN do servidor. Deixe vazio se o servidor não usar token.
token =
; Segundos de espera por resposta antes de guardar o evento na fila local.
timeout = 5

[maquina]
; Identificador desta máquina no painel. Vazio = usa o hostname do Windows.
id =

[cliente]
; sim = tela de login em tela cheia, que não pode ser fechada, até alguém entrar.
bloqueio = nao
; Senha para a CTI fechar o cliente com Ctrl+Shift+F12 (inclusive com bloqueio).
; Gere com:  python cliente.py --gerar-senha   e cole a linha aqui. Vazio = atalho desligado.
senha_manutencao =
; Aviso de privacidade (LGPD) exibido na tela de login. Vazio = não mostra nada.
; Para quebrar em várias linhas, continue o texto nas linhas seguintes com recuo.
; Exemplo:
; aviso = Seus dados (nome, curso, prontuário e horários de uso) são registrados
;     pela biblioteca para controle de uso dos computadores.
aviso =
