<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Painel{% endblock %} · Controle de uso</title>
  {% block cabecalho %}{% endblock %}
  <style>
    :root { --azul: #1f4e79; --borda: #d0d7de; --fundo: #f6f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Segoe UI, sans-serif; color: #1f2328; background: #fff; }
    nav { display: flex; gap: 1rem; align-items: center; padding: .75rem 1.5rem; background: var(--azul); }
    nav a, nav button { color: #fff; text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; }
    nav .direita { margin-left: auto; display: flex; gap: 1rem; align-items: center; color: #cfe0f0; }
    main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--borda); }
    th { background: var(--fundo); }
    form.inline { display: inline; }
    .filtros, .cadastro { display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; margin-bottom: 1rem;
                          padding: 1rem; background: var(--fundo); border: 1px solid var(--borda); border-radius: 6px; }
    label { display: flex; flex-direction: column; font-size: .8rem; gap: .2rem; }
    input, select, button.botao { padding: .4rem .6rem; border: 1px solid var(--borda); border-radius: 4px; font: inherit; }
    button.botao { background: var(--azul); color: #fff; border-color: var(--azul); cursor: pointer; }
    button.perigo { background: #b42318; border-color: #b42318; }
    .msg { padding: .6rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
    .msg.ok { background: #dafbe1; } .msg.erro { background: #ffebe9; }
    .vazio { color: #656d76; padding: 2rem 0; }
    .exportar a { margin-right: .75rem; }
    .inativa { color: #8c959f; }
  </style>
</head>
<body>
  {% if g.admin %}
  <nav>
    <a href="{{ url_for('painel.ativas') }}">Sessões ativas</a>
    <a href="{{ url_for('painel.historico') }}">Histórico</a>
    <a href="{{ url_for('painel.maquinas') }}">Máquinas</a>
    <span class="direita">{{ g.admin.usuario }}
      <form class="inline" method="post" action="{{ url_for('painel.sair') }}"><button>Sair</button></form>
    </span>
  </nav>
  {% endif %}
  <main>
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="msg {{ categoria }}">{{ mensagem }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
