{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Painel do administrador</h1>
<form method="post" class="cadastro" style="max-width: 360px; flex-direction: column; align-items: stretch;">
  <label>Usuário <input name="usuario" required autofocus></label>
  <label>Senha <input name="senha" type="password" required></label>
  <button class="botao">Entrar</button>
</form>
{% endblock %}
